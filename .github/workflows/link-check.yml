name: Weekly link check

on:
  schedule:
    # Mondays 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Excluded hosts: opensource.rock-chips.com, www.orangepi.org and
          # wiki.t-firefly.com refuse connections from GitHub-hosted runners
          # (verified live by hand; re-verified manually in the monthly
          # maintenance round instead). Everything else is checked weekly.
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,307,308,403,429
            --exclude "opensource\.rock-chips\.com"
            --exclude "www\.orangepi\.org"
            --exclude "wiki\.t-firefly\.com"
            README.md README.zh.md
          output: ./lychee/out.md
          fail: true

      - name: Open or update issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly link check: broken links found"
          content-filepath: ./lychee/out.md
          labels: |
            link-check
            maintenance
